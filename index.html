ackground:#1b1b1b;border:1px solid #262626;border-radius:13px;padding:11px}.list-row small{color:var(--muted)}.milestones{display:grid;gap:9px}.mile{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--border);background:var(--card);border-radius:16px}.mile-icon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:#202020}.mile.unlocked{border-color:rgba(255,107,0,.35)}.mile.unlocked .mile-icon{background:rgba(255,107,0,.14);animation:pulse 2s infinite}.mile b{font-size:12px}.mile small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.report-hero{background:linear-gradient(145deg,#21150d,#151515);border:1px solid rgba(255,107,0,.24);border-radius:24px;padding:24px;text-align:center;box-shadow:var(--shadow)}.report-hero .big{font-size:55px;font-weight:950;letter-spacing:-.08em;color:var(--orange);line-height:1}.report-hero h2{margin:12px 0 5px;font-size:22px}.report-hero p{margin:0;color:var(--muted);font-size:11px}.settings-list{display:grid;gap:9px}.setting{display:flex;align-items:center;justify-content:space-between;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:16px}.setting span{color:var(--muted);font-size:10px}.form{display:grid;gap:13px}.field label{display:block;color:#aaa;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px}.input,.select{width:100%;height:45px;border:1px solid #303030;border-radius:13px;background:#111;color:#fff;padding:0 12px;outline:none}.input:focus,.select:focus{border-color:var(--orange)}.time-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:flex-end;backdrop-filter:blur(8px)}.modal{width:100%;max-width:700px;margin:auto auto 0;background:#151515;border:1px solid #2a2a2a;border-bottom:0;border-radius:24px 24px 0 0;padding:18px 17px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:slideUp .25s ease}.modal.center{margin:auto;border-radius:24px;max-height:88vh}@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h3{margin:0;font-size:18px}.close{width:36px;height:36px;border-radius:11px;background:#222}.timer{padding:20px 8px;text-align:center}.timer-ring{width:205px;height:205px;border-radius:50%;margin:7px auto 20px;display:grid;place-items:center;background:radial-gradient(circle at center,#151515 64%,transparent 65%),conic-gradient(var(--orange) var(--pct,0%),#2b2b2b 0);animation:pulse 2.3s infinite}.timer-time{font-size:45px;font-weight:950;letter-spacing:-.06em;font-variant-numeric:tabular-nums}.timer-task{color:var(--muted);font-size:11px;margin-top:2px}.timer-warning{margin:10px auto;padding:10px;border-radius:12px;background:rgba(255,77,77,.08);color:#ff7777;font-size:10px;max-width:320px}.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#f5f5f5;color:#0b0b0b;padding:11px 14px;border-radius:12px;font-size:11px;font-weight:800;z-index:200;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}.photo img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.photo figcaption{padding:9px;font-size:10px;color:var(--muted)}.calendar-note{font-size:10px;color:var(--muted);margin-top:8px}.divider{height:1px;background:var(--border);margin:17px 0}.notice{font-size:10px;color:#aaa;line-height:1.5;background:#101010;border:1px solid #242424;border-radius:13px;padding:11px}.switch{width:48px;height:28px;border-radius:99px;background:#333;padding:3px}.switch i{display:block;width:22px;height:22px;border-radius:50%;background:#aaa;transition:.2s}.switch.on{background:rgba(255,107,0,.35)}.switch.on i{transform:translateX(20px);background:var(--orange)}@media(min-width:700px){.content{padding-left:24px;padding-right:24px}.bottom{left:50%;right:auto;width:min(600px,100%);transform:translateX(-50%);border:1px solid var(--border);border-bottom:0;border-radius:18px 18px 0 0}.hero{padding:24px}.modal{border-radius:24px;border:1px solid #2a2a2a;margin:auto}.fab{bottom:100px}.photo-grid{grid-template-columns:repeat(3,1fr)}}

<body>
<div id="intro" class="intro"><div class="intro-inner"><div class="intro-kicker">WELCOME TO</div><div class="intro-title"><span>WINTER</span> ARC</div><div class="intro-sub">DISCIPLINE STARTS NOW</div></div></div>
<div class="app" id="app">
<header class="topbar"><div class="brand"><b>AK</b> 90 DAY</div><button class="icon-btn" onclick="openSettings()" aria-label="Settings">⚙️</button></header>
<main class="content">
<section id="homePage" class="page active"></section>
<section id="weeklyPage" class="page"></section>
<section id="progressPage" class="page"></section>
<section id="reportPage" class="page"></section>
</main>
</div>
<button id="fab" class="fab hide" onclick="openTaskForm()">＋</button>
<nav class="bottom"><div class="nav"><button data-page="homePage" class="active" onclick="showPage('homePage')"><span class="ni">⌂</span>Home</button><button data-page="weeklyPage" onclick="showPage('weeklyPage')"><span class="ni">▣</span>Weekly</button><button data-page="progressPage" onclick="showPage('progressPage')"><span class="ni">◉</span>Progress</button><button data-page="reportPage" onclick="showPage('reportPage')"><span class="ni">▤</span>Report</button></div></nav>
<div id="modalRoot"></div><div id="toast" class="toast"></div>
<script>
'use strict';
const KEY='AK_WINTER_ARC_DATA';
const DAY=86400000;
let data=loadData();
let selectedDayIndex=null;
let activeTimer=null;
let reminderTimer=null;

function freshData(){return{profile:{name:'',startDate:'',endDate:'',photoInterval:7},challenge:{},tasks:[],days:{},photos:[],ringtone:{type:'beep',dataUrl:'',name:''},settings:{notifications:false}}}
function loadData(){try{const raw=localStorage.getItem(KEY);if(!raw)return freshData();const d=JSON.parse(raw);return Object.assign(freshData(),d,{profile:Object.assign(freshData().profile,d.profile||{}),ringtone:Object.assign(freshData().ringtone,d.ringtone||{}),settings:Object.assign(freshData().settings,d.settings||{})})}catch(e){return freshData()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){toast('Storage is full. Large audio/photos may exceed browser LocalStorage.');return false}}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function pad(n){return String(n).padStart(2,'0')}
function dateKey(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function parseDate(s){if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,0,0,0,0)}
function fmtDate(s){const d=parseDate(s);return d?d.toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'}):'—'}
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function diffDays(a,b){return Math.round((b-a)/DAY)}
function totalDays(){const s=parseDate(data.profile.startDate),e=parseDate(data.profile.endDate);return s&&e&&e>=s?diffDays(s,e)+1:0}
function currentIndex(){const s=parseDate(data.profile.startDate);if(!s)return null;const n=diffDays(s,today());const total=totalDays();return n>=0&&n<total?n:null}
function challengeStatus(){const s=parseDate(data.profile.startDate),e=parseDate(data.profile.endDate),t=today();if(!s||!e)return'not-set';if(t<s)return'upcoming';if(t>e)return'complete';return'active'}
function weekIndex(index){return Math.floor(index/7)}
function weekLabel(w){return `Week ${w+1}`}
function ensureDay(index){const k=String(index);if(!data.days[k])data.days[k]={records:{},createdAt:Date.now()};return data.days[k]}
function ensureRecord(dayIndex,taskId){const day=ensureDay(dayIndex);if(!day.records[taskId])day.records[taskId]={status:'pending',score:0,startTime:null,finishTime:null,actualDuration:0,reminderShown:false};return day.records[taskId]}
function getTask(id){return data.tasks.find(t=>t.id===id)}
function taskForDay(task,index){if(!task)return null;const w=weekIndex(index);return Object.assign({},task,scheduleForWeek(task,w))}
function scheduleForWeek(task,w){let sched=task.scheduleByWeek?.[w];if(sched)return sched;let keys=Object.keys(task.scheduleByWeek||{}).map(Number).filter(n=>n<=w).sort((a,b)=>b-a);if(keys.length)return task.scheduleByWeek[keys[0]];return {start:task.defaultStart||'06:00',end:task.defaultEnd||'07:00'}}
function weekChangeUsed(task,w){return !!task.weekChanges?.[w]}
function setSchedule(task,w,start,end){task.scheduleByWeek=task.scheduleByWeek||{};task.weekChanges=task.weekChanges||{};task.scheduleByWeek[w]={start,end};task.weekChanges[w]=true}
function timeToMinutes(v){const [h,m]=v.split(':').map(Number);return h*60+m}
function nowMinutes(){const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60}
function time12(v){if(!v)return'—';const [h,m]=v.split(':').map(Number);const ap=h>=12?'PM':'AM';const hh=h%12||12;return `${hh}:${pad(m)} ${ap}`}
function timeDateFor(date,hhmm){const [h,m]=hhmm.split(':').map(Number);const d=new Date(date);d.setHours(h,m,0,0);return d}
function allowedState(schedule){const n=nowMinutes(),s=timeToMinutes(schedule.start),e=timeToMinutes(schedule.end);if(n<s)return {state:'before',label:`Starts at ${time12(schedule.start)}`};if(n>e)return {state:'after',label:'Allowed time ended'};return {state:'open',label:'Available now'}}
function currentDayLockedMessage(index){const c=currentIndex();if(c===null)return challengeStatus()==='upcoming'?'Challenge has not started yet.':'Challenge has ended.';if(index>c)return'Future day — locked 🔒';if(index<c)return'Past day — view only 🔒';return''}
function taskStatsForDay(index){let total=0,done=0,late=0,missed=0,score=0;data.tasks.forEach(t=>{const r=data.days[String(index)]?.records?.[t.id];if(!r||r.status==='pending')return;total++;score+=Number(r.score||0);if(r.status==='done')done++;else if(r.status==='late')late++;else if(r.status==='missed')missed++});const all=data.tasks.length;return{total,done,late,missed,score:all?Math.round(score/all):0,all,complete100:all>0&&done===all}}
function overallStats(){let completed=0,late=0,missed=0,totalTasks=0,totalScore=0,daysWithRecords=0,perfectDays=0;const total=totalDays();for(let i=0;i<total;i++){const s=taskStatsForDay(i);if(s.total)daysWithRecords++;completed+=s.done;late+=s.late;missed+=s.missed;totalTasks+=s.all;totalScore+=s.score; if(s.all&&s.done===s.all)perfectDays++}return{completed,late,missed,totalTasks,totalScore,overallScore:total?Math.round(totalScore/total):0,challengeProgress:total?Math.round(((currentIndex()===null?(challengeStatus()==='complete'?total:0):currentIndex()+1)/total)*100):0,perfectDays}}
function dailyStreak(){const total=totalDays();let end=currentIndex();if(end===null&&challengeStatus()==='complete')end=total-1;if(end===null)return 0;let streak=0;for(let i=end;i>=0;i--){const s=taskStatsForDay(i);if(data.tasks.length&&s.done===data.tasks.length)streak++;else break}return streak}
function milestoneList(){const total=totalDays();const arr=[7,14,30,60].filter(n=>total>=n).map(n=>({n,unlocked:dailyStreak()>=n}));if(total>0)arr.push({n:total,final:true,unlocked:challengeStatus()==='complete'||(currentIndex()===total-1&&taskStatsForDay(total-1).done===data.tasks.length&&data.tasks.length>0)});return arr}
function greeting(){const h=new Date().getHours();let x=h<12?'Good Morning':h<17?'Good Afternoon':h<21?'Good Evening':'Good Night';return `${x}, ${data.profile.name||'Athlete'} 👋`}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){renderHome();renderWeekly();renderProgress();renderReport();document.getElementById('fab').classList.toggle('hide',currentIndex()===null||document.querySelector('.page.active')?.id!=='homePage')}
function renderHome(){const el=document.getElementById('homePage'),status=challengeStatus(),total=totalDays(),ci=currentIndex();if(!data.profile.startDate||!data.profile.endDate){el.innerHTML=`<div class="greeting"><div class="eyebrow">AK 90 DAY</div><h1>Welcome to Winter Arc.</h1><div class="subtitle">Discipline today. Freedom tomorrow.</div></div><div class="hero"><div class="hero-day"><small>SETUP REQUIRED</small>Start your challenge</div><p class="subtitle">Create your profile and choose your start/end dates. The app calculates the exact inclusive duration automatically.</p><button class="btn primary" style="margin-top:16px;width:100%" onclick="openSettings(true)">SET UP PROFILE</button></div>`;return}let idx=selectedDayIndex??ci;if(idx===null)idx=status==='complete'?total-1:0;idx=Math.max(0,Math.min(total-1,idx));selectedDayIndex=idx;const s=taskStatsForDay(idx),p=Math.round((idx+1)/total*100),lock=currentDayLockedMessage(idx);const isCurrent=ci===idx;const tasks=data.tasks.map(t=>({t,r:ensureRecord(idx,t.id),x:taskForDay(t,idx)}));el.innerHTML=`<div class="greeting"><div class="eyebrow">AK 90 DAY</div><h1>${esc(greeting())}</h1><div class="subtitle">Discipline today. Freedom tomorrow.</div></div>

function renderDayPicker(idx,total,ci){let start=Math.max(0,idx-2),end=Math.min(total-1,idx+2),html='<div class="section-head"><h2>Challenge Days</h2><span>SWIPE</span></div><div class="day-picker">';for(let i=start;i<=end;i++){const locked=ci!==null&&(i>ci);const past=ci!==null&&i<ci;html+=`<button class="day-chip ${i===idx?'current':''} ${locked?'locked':''}" onclick="selectDay(${i})"><strong>Day ${i+1}${locked?' 🔒':past?'':' •'}</strong><span>${fmtDate(dateKey(new Date(parseDate(data.profile.startDate).getTime()+i*DAY)))}</span></button>`}return html+'</div>'}

function renderTask(t,r,x,index,isCurrent,isPast){const sched=scheduleForWeek(t,weekIndex(index));let status=r.status;let badge=status==='done'?'<span class="badge done">DONE · 100%</span>':status==='late'?'<span class="badge late">LATE · 70%</span>':status==='missed'?'<span class="badge missed">MISSED · 0%</span>':index>currentIndex()?'<span class="badge locked">LOCKED 🔒</span>':'<span class="badge">PENDING</span>';let note='';if(r.status==='pending'&&isCurrent){const a=allowedState(sched);note=`<span class="start-note">${esc(a.label)}</span>`}else if(!isCurrent)note=`<span class="start-note">${index<currentIndex()?'View only 🔒':'Locked 🔒'}</span>`;const canEdit=isCurrent&&r.status==='pending';const canStart=isCurrent&&r.status==='pending';return `<article class="task ${status==='done'?'done':''}"><div class="task-head"><div class="task-emoji">${esc(t.emoji||'🔥')}</div><div class="task-main"><div class="task-name">${esc(t.name)}</div><div class="task-meta"><span>${time12(sched.start)} – ${time12(sched.end)}</span><span>•</span><span>${durationText(t.duration)}</span>${t.reminder?`<span>• ⏰ ${time12(t.reminder)}</span>`:''}</div></div>${badge}</div><div class="task-actions">${canStart?`<button class="btn primary" onclick="tryStartTask('${t.id}',${index})">START TASK</button>`:''}${r.status==='pending'&&isCurrent?note:''}${canEdit?`<button class="btn ghost" onclick="openTaskForm('${t.id}')">Edit</button><button class="btn ghost danger" onclick="deleteTask('${t.id}')">Delete</button>`:''}${r.status!=='pending'?`<button class="btn ghost" onclick="showHistory('${t.id}')">History</button>`:''}</div></article>`}
function durationText(min){min=Number(min||0);return min>=60?`${Math.floor(min/60)}h${min%60?` ${min%60}m`:''}`:`${min} min`}
function openTaskForm(id=''){const current=currentIndex();if(current===null){toast('Only the current challenge day can be edited.');return}const task=id?getTask(id):null;if(task){const r=data.days[String(current)]?.records?.[id];if(r&&r.status!=='pending'){toast('Completed task records are locked.');return}}const sched=task?scheduleForWeek(task,weekIndex(current)):{start:'06:00',end:'07:00'};const used=task?weekChangeUsed(task,weekIndex(current)):false;openModal(`<div class="modal-head"><h3>${task?'Edit Task':'New Task'}</h3><button class="close" onclick="closeModal()">✕</button></div><form class="form" onsubmit="saveTask(event,'${id}',${current})"><div class="field"><label>Task Name</label><input class="input" id="fName" required maxlength="50" value="${esc(task?.name||'')}" placeholder="Running, Study, Workout..."></div><div class="field"><label>Emoji</label><input class="input" id="fEmoji" required maxlength="8" value="${esc(task?.emoji||'🔥')}" placeholder="🏃"></div><div class="time-row"><div class="field"><label>Allowed Start</label><input class="input" id="fStart" required type="time" value="${sched.start}"></div><div class="field"><label>Allowed End</label><input class="input" id="fEnd" required type="time" value="${sched.end}"></div></div><div class="field"><label>Duration (minutes)</label><input class="input" id="fDuration" required type="number" min="1" max="1440" value="${task?.duration||30}"></div><div class="field"><label>Reminder Time</label><input class="input" id="fReminder" type="time" value="${task?.reminder||''}"></div>${task&&used?'<div class="notice">Allowed time can be changed only once this week. This week\'s change has already been used.</div>':''}<div class="notice">A task must start during the allowed window and finish before that window ends. Completion before the full duration is not accepted.</div><button class="btn primary" type="submit">${task?'SAVE CHANGES':'ADD TASK'}</button></form>`)}
function saveTask(e,id,index){e.preventDefault();const name=document.getElementById('fName').value.trim(),emoji=document.getElementById('fEmoji').value.trim()||'🔥',start=document.getElementById('fStart').value,end=document.getElementById('fEnd').value,duration=Number(document.getElementById('fDuration').value),reminder=document.getElementById('fReminder').value;if(timeToMinutes(end)<=timeToMinutes(start)){toast('End time must be after start time.');return}const w=weekIndex(index);if(id){const t=getTask(id);const old=scheduleForWeek(t,w);const changed=old.start!==start||old.end!==end;if(changed&&weekChangeUsed(t,w)){toast('Allowed time can be changed only once this week.');return}Object.assign(t,{name,emoji,duration,reminder});if(changed)setSchedule(t,w,start,end);if(!t.scheduleByWeek)t.scheduleByWeek={[w]:{start,end}};if(!t.scheduleByWeek[w])t.scheduleByWeek[w]={start,end};}else{const nid='t_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);data.tasks.push({id:nid,name,emoji,duration,reminder,defaultStart:start,defaultEnd:end,scheduleByWeek:{[w]:{start,end}},weekChanges:{}})}save();closeModal();render();toast(id?'Task updated':'Task added');}
function deleteTask(id){const idx=currentIndex();if(idx===null)return;const r=data.days[String(idx)]?.records?.[id];if(r&&r.status!=='pending'){toast('Historical/completed records cannot be deleted.');return}if(!confirm('Delete this task? Existing history will remain locked.'))return;data.tasks=data.tasks.filter(t=>t.id!==id);save();render();toast('Task deleted');}
function tryStartTask(id,index){if(index!==currentIndex()){toast('Only the current day can be started.');return}const t=getTask(id),r=ensureRecord(index,id),sched=scheduleForWeek(t,weekIndex(index)),a=allowedState(sched);if(r.status!=='pending'){toast('This task is already recorded.');return}if(a.state==='before'){toast(`Starts at ${time12(sched.start)}`);return}if(a.state==='after'){toast('Allowed time ended');return}const now=new Date(),end=timeDateFor(now,sched.end),remaining=end-now;r.startTime=now.toISOString();save();startTimer(id,index);}
function startTimer(id,index){const t=getTask(id),sched=scheduleForWeek(t,weekIndex(index)),r=ensureRecord(index,id);closeModal();openModal(`<div class="modal center"><div class="modal-head"><h3>ACTIVE MISSION</h3><button class="close" onclick="closeModal()">✕</button></div><div class="timer"><div id="timerRing" class="timer-ring"><div><div id="timerTime" class="timer-time">${fmtTimer(t.duration*60)}</div><div class="timer-task">${esc(t.emoji)} ${esc(t.name)}</div></div></div><div class="notice">Allowed: ${time12(sched.start)} – ${time12(sched.end)}<br>Finish becomes available only after the full ${durationText(t.duration)}.</div><div id="timerWarning" class="timer-warning hide"></div><button id="finishBtn" class="btn primary" style="width:100%;margin-top:12px" disabled onclick="finishTask('${id}',${index})">FINISH TASK</button></div></div>`);activeTimer={id,index,endAt:Date.now()+t.duration*60000,deadline:timeDateFor(new Date(),sched.end).getTime()};tickTimer()}
function fmtTimer(sec){sec=Math.max(0,Math.ceil(sec));return `${pad(Math.floor(sec/60))}:${pad(sec%60)}`}
function tickTimer(){if(!activeTimer)return;const left=Math.max(0,activeTimer.endAt-Date.now()),deadlineLeft=Math.max(0,activeTimer.deadline-Date.now());const t=getTask(activeTimer.id),total=t.duration*60000,el=document.getElementById('timerTime'),ring=document.getElementById('timerRing'),finish=document.getElementById('finishBtn'),warn=document.getElementById('timerWarning');if(!el){activeTimer=null;return}if(deadlineLeft<=0&&left>0){const r=ensureRecord(activeTimer.index,activeTimer.id);r.status='missed';r.score=0;save();if(warn){warn.textContent='Allowed time ended — this task is MISSED / INCOMPLETE.';warn.classList.remove('hide')}if(finish)finish.disabled=true;setTimeout(()=>{activeTimer=null;closeModal();render();toast('Task missed — allowed time expired.');},800);return}el.textContent=fmtTimer(Math.ceil(left/1000));ring.style.setProperty('--pct',`${Math.min(100,((total-left)/total)*100)}%`);if(left<=0){finish.disabled=false;finish.textContent='FINISH TASK';if(warn)warn.classList.add('hide')}else{finish.disabled=true;finish.textContent=`FINISH IN ${fmtTimer(Math.ceil(left/1000))}`}activeTimer.raf=setTimeout(tickTimer,250)}
function finishTask(id,index){if(!activeTimer||activeTimer.id!==id)return;const t=getTask(id),sched=scheduleForWeek(t,weekIndex(index)),r=ensureRecord(index,id),now=new Date();if(Date.now()<activeTimer.endAt-100){toast('Finish is locked until the full duration is complete.');return}if(now>timeDateFor(now,sched.end)){r.status='missed';r.score=0;save();activeTimer=null;closeModal();render();toast('Allowed time expired — missed.');return}r.finishTime=now.toISOString();r.actualDuration=Math.round((new Date(r.finishTime)-new Date(r.startTime))/60000);const ideal=new Date(new Date(r.startTime).getTime()+t.duration*60000);r.status=now<=timeDateFor(now,sched.start).getTime()+t.duration*60000?'done':'done';const onTimeDeadline=timeDateFor(now,sched.start).getTime()+t.duration*60000;r.status=now.getTime()<=onTimeDeadline?'done':'late';r.score=r.status==='done'?100:70;save();playRingtone();activeTimer=null;closeModal();render();toast(r.status==='done'?'DONE · 100%':'LATE · 70%')}
function showHistory(id){const t=getTask(id);const rows=[];for(let i=0;i<totalDays();i++){const r=data.days[String(i)]?.records?.[id];if(r&&r.status&&r.status!=='pending')rows.push({i,r})}openModal(`<div class="modal-head"><h3>${esc(t.name)} · History</h3><button class="close" onclick="closeModal()">✕</button></div>${rows.length?`<div class="list">${rows.map(({i,r})=>`<div class="list-row"><div><b>Day ${i+1}</b><small>${fmtDate(dateKey(new Date(parseDate(data.profile.startDate).getTime()+i*DAY)))}</small></div><div style="text-align:right"><b>${r.status.toUpperCase()}</b><small>${r.finishTime?new Date(r.finishTime).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'—'} · ${r.score}%</small></div></div>`).join('')}</div>`:'<div class="empty"><b>No completed history</b>This task has no recorded completion yet.</div>'}`)}
function renderWeekly(){const el=document.getElementById('weeklyPage'),total=totalDays();if(!total){el.innerHTML=setupEmpty('Weekly Progress','Set your challenge dates in Settings.');return}let html=`<div class="eyebrow">WEEKLY</div><h1 style="font-size:29px;margin:7px 0 5px">Weekly Progress</h1><div class="subtitle">See completion quality, not just activity.</div>`;const weeks=Math.ceil(total/7);for(let w=0;w<weeks;w++){const a=w*7,b=Math.min(total-1,a+6);let sum=0,perfect=[],incomplete=[],completed=0,late=0,missed=0;for(let i=a;i<=b;i++){const s=taskStatsForDay(i);sum+=s.score;completed+=s.done;late+=s.late;missed+=s.missed;if(data.tasks.length&&s.done===data.tasks.length)perfect.push(i+1);else if(i<= (currentIndex()??-1))incomplete.push(i+1)}const pct=Math.round(sum/(b-a+1));html+=`<div class="card" style="margin-top:15px"><div class="section-head" style="margin:0 0 12px"><h2>${weekLabel(w)}</h2><span>${fmtDate(dateKey(new Date(parseDate(data.profile.startDate).getTime()+a*DAY)))} – ${fmtDate(dateKey(new Date(parseDate(data.profile.startDate).getTime()+b*DAY)))}</span></div><div class="progress-label"><span>Progress</span><b>${pct}%</b></div><div class="progress"><i style="width:${pct}%"></i></div><div class="hero-grid" style="margin-top:13px"><div class="stat"><strong>${completed}</strong><span>Completed</span></div><div class="stat"><strong>${late}</strong><span>Late</span></div><div class="stat"><strong>${missed}</strong><span>Missed</span></div></div><div class="divider"></div><div class="bar-row"><label><span>100% Completed Days</span><b>${perfect.length}</b></label><div class="list">${perfect.length?perfect.map(x=>`<div class="list-row"><b>Day ${x}</b><small>100% completed</small></div>`).join(''):'<div class="notice">No perfect days in this week yet.</div>'}</div></div><div class="bar-row"><label><span>Incomplete / Missed Days</span><b>${incomplete.length}</b></label><div class="list">${incomplete.length?incomplete.map(x=>`<div class="list-row"><b>Day ${x} function renderProgress(){const el=document.getElementById('progressPage'),o=overallStats();if(!totalDays()){el.innerHTML=setupEmpty('Progress','Set your challenge dates to begin tracking.');return}const streak=dailyStreak();el.innerHTML=`<div class="eyebrow">PROGRESS</div><h1 style="font-size:29px;margin:7px 0 5px">Arc Progress</h1><div class="subtitle">Your challenge, measured day by day.</div><div class="metric-grid" style="margin-top:18px"><div class="card metric"><strong>${o.challengeProgress}%</strong><span>Challenge progress</span><div class="progress" style="margin-top:11px"><i style="width:${o.challengeProgress}%"></i></div></div><div class="card metric"><strong>${o.overallScore}%</strong><span>Overall task score</span><div class="progress" style="margin-top:11px"><i style="width:${o.overallScore}%"></i></div></div></div><div class="metric-grid" style="margin-top:10px"><div class="card metric"><strong>🔥 ${streak}</strong><span>Current streak</span></div><div class="card metric"><strong>${o.completed}</strong><span>Completed tasks</span></div><div class="card metric"><strong>${o.late}</strong><span>Late tasks</span></div><div class="card metric"><strong>${o.missed}</strong><span>Missed tasks</span></div></div><div class="section-head"><h2>Milestones</h2><span>KEEP GOING</span></div><div class="milestones">${milestoneList().map(m=>`<div class="mile ${m.unlocked?'unlocked':''}"><div class="mile-icon">${m.unlocked?'🔥':'🔒'}</div><div><b>${m.final?'Final Challenge':m.n+' Day'}</b><small>${m.unlocked?'UNLOCKED':'LOCKED'}${m.final?' · '+totalDays()+' day challenge':''}</small></div></div>`).join('')}</div><div class="section-head"><h2>Progress Photos</h2><span>${data.profile.photoInterval?`EVERY ${data.profile.photoInterval} DAYS`:'OFF'}</span></div>${renderPhotos()}`}

function openSettings(force=false){const p=data.profile;openModal(`<div class="modal"><div class="modal-head"><h3>Profile & Settings</h3><button class="close" onclick="closeModal()">✕</button></div><form class="form" onsubmit="saveSettings(event)"><div class="field"><label>Profile Name</label><input class="input" id="sName" maxlength="40" required value="${esc(p.name)}" placeholder="Your name"></div><div class="time-row"><div class="field"><label>Start Date</label><input class="input" id="sStart" type="date" required value="${p.startDate}"></div><div class="field"><label>End Date</label><input class="input" id="sEnd" type="date" required value="${p.endDate}"></div></div><div id="datePreview" class="notice">Choose dates to see inclusive challenge length.</div><div class="field"><label>Progress Photo Every N Days (0 = OFF)</label><input class="input" id="sPhoto" type="number" min="0" max="365" value="${Number(p.photoInterval||0)}"></div><div class="divider"></div><div class="field"><label>Ringtone</label><select class="select" id="sRing"><option value="beep" ${data.ringtone.type==='beep'?'selected':''}>Built-in Beep</option><option value="bell" ${data.ringtone.type==='bell'?'selected':''}>Built-in Bell</option><option value="custom" ${data.ringtone.type==='custom'?'selected':''}>Custom Audio</option></select></div><div class="field"><label>Custom Audio File</label><input class="input" id="sAudio" type="file" accept="audio/*"><div class="calendar-note">${data.ringtone.name?`Current: ${esc(data.ringtone.name)}`:'No custom audio selected.'} Large audio files can exceed LocalStorage limits.</div></div><button type="button" class="btn" onclick="testRingtone()">TEST RINGTONE</button><button type="button" class="btn" onclick="requestNotifications()">${data.settings.notifications?'NOTIFICATIONS ENABLED':'ENABLE NOTIFICATIONS'}</button><button class="btn primary" type="submit">SAVE SETTINGS</button></form><div class="divider"></div><div class="settings-list"><button class="set function updateDatePreview(){const s=document.getElementById('sStart')?.value,e=document.getElementById('sEnd')?.value,box=document.getElementById('datePreview');if(!box)return;const a=parseDate(s),b=parseDate(e);if(a&&b&&b>=a)box.textContent=`${diffDays(a,b)+1} DAYS · ${fmtDate(s)} → ${fmtDate(e)} (inclusive)`;else box.textContent='End date must be on or after start date.'}
function saveSettings(e){e.preventDefault();const name=document.getElementById('sName').value.trim(),start=document.getElementById('sStart').value,end=document.getElementById('sEnd').value,photo=Math.max(0,Number(document.getElementById('sPhoto').value||0)),ring=document.getElementById('sRing').value;if(!name){toast('Enter a profile name.');return}const a=parseDate(start),b=parseDate(end);if(!a||!b||b<a){toast('Choose valid challenge dates.');return}const oldStart=data.profile.startDate,oldEnd=data.profile.endDate;data.profile={name,startDate:start,endDate:end,photoInterval:photo};data.challenge={totalDays:diffDays(a,b)+1};if(ring!=='custom'){data.ringtone.type=ring}const file=document.getElementById('sAudio').files[0];if(file){if(file.size>3.5*1024*1024&&!confirm('This audio file is large and may exceed LocalStorage limits. Continue?'))return;const reader=new FileReader();reader.onload=()=>{data.ringtone={type:'custom',dataUrl:reader.result,name:file.name};save();afterSettings(oldStart,oldEnd)};reader.onerror=()=>toast('Could not read audio file.');reader.readAsDataURL(file);return}save();afterSettings(oldStart,oldEnd)}
function afterSettings(oldStart,oldEnd){closeModal();selectedDayIndex=currentIndex();render();toast(oldStart&&oldEnd&&oldStart!==data.profile.startDate||oldEnd!==data.profile.endDate?'Challenge dates updated.':'Settings saved.');checkPhotoPrompt()}
function openPhotoUploader(){openModal(`<div class="modal center"><div class="modal-head"><h3>Progress Photo 📸</h3><button class="close" onclick="closeModal()">✕</button></div><div class="form"><div class="field"><label>Photo</label><input class="input" id="photoFile" type="file" accept="image/*"></div><div class="notice">The image is compressed and stored locally. Nothing is uploaded to a server.</div><button class="btn primary" onclick="savePhoto()">SAVE PHOTO</button></div></div>`)}
function savePhoto(){const f=document.getElementById('photoFile')?.files[0],idx=currentIndex();if(!f||idx===null){toast('Choose an image while the challenge is active.');return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),max=900,scale=Math.min(1,max/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const dataUrl=c.toDataURL('image/jpeg',.78);data.photos=data.photos||[];data.photos.push({id:'p_'+Date.now(),day:idx+1,date:dateKey(today()),dataUrl});if(!save()){data.photos.pop();return}closeModal();render();toast('Progress photo saved locally 📸')};img.src=reader.result};reader.readAsDataURL(f)}
function checkPhotoPrompt(){const n=Number(data.profile.photoInterval||0),idx=currentIndex();if(!n||idx===null||idx===0)return;const day=idx+1;if(day%n===0&&!data.photos.some(p=>p.day===day)){setTimeout(()=>{if(confirm(`Time for your progress photo 📸\\nDay ${day}`))openPhotoUploader()},400)}}
function requestNotifications(){if(!('Notification'in window)){toast('Notifications are not supported by this browser.');return}Notification.requestPermission().then(p=>{data.settings.notifications=p==='granted';save();toast(p==='granted'?'Notifications enabled':'Notification permission not granted')})}
function reminderCheck(){const idx=currentIndex();if(idx===null)return;const now=new Date();const mm=now.getHours()*60+now.getMinutes();data.tasks.forEach(t=>{if(!t.reminder)return;const r=ensureRecord(idx,t.id);const rm=timeToMinutes(t.reminder);if(mm===rm&&!r.reminderShown){r.reminderShown=true;save();playRingtone();const msg=`${t.emoji||'🔥'} ${t.name} reminder`;toast(msg);if(data.settings.notifications&&'Notification'in window&&Notification.permission==='granted')new Notification('AK Winter Arc',{body:msg})}})}
function playRingtone(){try{if(data.ringtone.type==='custom'&&data.ringtone.dataUrl){const a=new Audio(data.ringtone.dataUrl);a.volume=.65;a.play().catch(()=>{});return}const ctx=new (window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=data.ringtone.type==='bell'?'sine':'square';osc.frequency.value=data.ringtone.type==='bell'?880:660;gain.gain.setValueAtTime(.001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+.02);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.45);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.5)}catch(e){}}
function testRingtone(){playRingtone();toast('Ringtone tested')}
function openModal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">${html}</div>`}
function closeModal(){if(activeTimer){clearTimeout(activeTimer.raf);activeTimer=null}document.getElementById('modalRoot').innerHTML=''}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),2500)}
function confirmReset(){if(!confirm('Reset this challenge? Historical records, tasks, and photos will be removed. This cannot be undone.'))return;const name=data.profile.name;data=freshData();data.profile.name=name;save();closeModal();selectedDayIndex=null;render();toast('Challenge reset')}
function confirmClear(){if(!confirm('Clear ALL Winter Arc LocalStorage data? This cannot be undone.'))return;localStorage.removeItem(KEY);data=freshData();selectedDayIndex=null;closeModal();render();toast('Local data cleared')}
function boot(){render();setInterval(()=>{reminderCheck();if(currentIndex()!==selectedDayIndex&&document.querySelector('.page.active')?.id==='homePage'){selectedDayIndex=currentIndex();render()}},1000);setTimeout(checkPhotoPrompt,2800)}
window.addEventListener('beforeunload',()=>{if(activeTimer){clearTimeout(activeTimer.raf)}});
boot();
</script>
</body>
</html>
